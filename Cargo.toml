[workspace]
members = [
    "common",
    "parser",
    "saver",
    "programs/pump/pumpfun",
    "programs/pump/pumpswap",
    "tools/standalone_indexer",
    "tools/visual_inspector",
    "util/block_loader",
    "util/transaction_loader",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
bs58 = "0.5.1"
common = { path = "common" }
dotenvy = "0.15.7"
futures-util = "0.3.31"
pumpfun = { path = "programs/pump/pumpfun" }
pumpswap = { path = "programs/pump/pumpswap" }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde_json = "1.0"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
webpki-roots = "1.0.3"
